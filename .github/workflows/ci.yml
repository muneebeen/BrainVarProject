name: BrainVar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend packages
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci
      - name: Check frontend code
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Connect to EC2 and deploy
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh ubuntu@"$EC2_HOST" << 'EOF'
            set -e
            cd /home/ubuntu/brainvar
            GIT_SSH_COMMAND='ssh -i /home/ubuntu/.ssh/brainvar_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' git pull --ff-only
            /home/ubuntu/brainvar/.venv/bin/python -m pip install -r backend/requirements.txt
            cd frontend
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/brainvar/
            sudo systemctl restart brainvar
          EOF
